# SPDX-License-Identifier: Apache-2.0
# Builds and tests clipman for Linux (binary, AppImage, Flatpak) and Windows on every push to
# main and on pull requests. Pushing a tag like v0.2.0 also publishes a GitHub release
# with those files attached.
#
# Pushing a commit to main together with its release tag starts two runs for the same
# commit. The branch run skips the build when a v* tag already points at its commit,
# since the tag run builds it and publishes the release. Push both refs in one go
# (`git push --atomic origin main v0.2.0`) so the tag exists by the time the check runs.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # skip branch builds of a commit that has a release tag (its tag run does the work)
  check:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - id: tag
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          # annotated tags list the commit on their "^{}" line, lightweight ones directly
          if git ls-remote --tags "$REPO_URL" 'v*' | grep -qE "^${SHA}[[:space:]]+refs/tags/v"; then
            echo "A release tag points at ${SHA}: its tag run builds it, skipping this one."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: check
    if: needs.check.outputs.tagged != 'true'
    # the oldest supported Ubuntu: an AppImage needs a glibc at least as new as the
    # machine it was built on, so building on an older one makes it run on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Package
        run: |
          mkdir -p dist
          cp target/appimage/*.AppImage dist/
          tar -C target/release -czf dist/clipman-linux-x86_64.tar.gz clipman
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: clipman-linux
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: check
    if: needs.check.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    # has flatpak-builder and the Freedesktop runtime and SDK; the action installs the
    # Rust extension from Flathub
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/men.goobers.clipman.yml
          bundle: Clipman-${{ steps.version.outputs.version }}-x86_64.flatpak
          artifact-name: clipman-flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}

  windows:
    needs: check
    if: needs.check.outputs.tagged != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/clipman.exe, README.md, LICENSE -DestinationPath dist/clipman-windows-x86_64.zip
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: clipman-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
